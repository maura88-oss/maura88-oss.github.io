<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文章 · MAURA</title>
<style>
  :root { --black:#0a0a0a; --blood:#a01616; --blood-light:#e02929; --ash:#cfc6c6; --ash-dim:#7d7373; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: Georgia, "Times New Roman", "Songti SC", serif;
    background: radial-gradient(ellipse 80% 50% at 50% -10%, #1c0a0a 0%, rgba(10,10,10,0) 70%), var(--black);
    color: var(--ash);
    min-height: 100vh;
    padding: 64px 24px 100px;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  .moon { display:block; margin: 0 auto 26px; filter: drop-shadow(0 0 8px rgba(224,41,41,.4)); }
  .top {
    display: flex; align-items: baseline; justify-content: space-between;
    border-bottom: 1px solid rgba(160,22,22,.5);
    padding-bottom: 18px;
    margin-bottom: 52px;
  }
  .top h1 {
    font-size: 30px; font-weight: normal; letter-spacing: .3em; color: #f2ecec;
    text-shadow: 0 0 16px rgba(160,22,22,.5);
  }
  .top h1 span { color: var(--blood-light); }
  .top a { color: var(--ash-dim); text-decoration: none; font-size: 13px; letter-spacing: .2em; transition: color .3s; }
  .top a:hover { color: var(--blood-light); }
  .empty {
    text-align: center; padding: 60px 0 40px; color: var(--ash-dim); letter-spacing: .25em;
  }
  .empty .sigil { font-size: 34px; color: var(--blood); margin-bottom: 28px; }
  .snake { display:block; margin: 0 auto; filter: drop-shadow(0 0 6px rgba(160,22,22,.5)); }
  footer {
    text-align: center; margin-top: 80px; font-size: 12px; letter-spacing: .2em; color: #4d4545;
  }
</style>
</head>
<body>
  <div class="wrap">
    <svg class="moon" width="44" height="44" viewBox="0 0 64 64" fill="none">
      <path d="M 42 6 A 28 28 0 1 0 42 58 A 23 23 0 1 1 42 6 Z" stroke="#e02929" stroke-width="2.2" opacity="0.9"/>
    </svg>
    <div class="top">
      <h1>文<span>章</span></h1>
      <a href="/">← 返回首页</a>
    </div>
    <div class="empty">
      <div class="sigil">✠</div>
      <p>墨 迹 未 干 · 静 待 首 篇</p>
      <p style="margin-top:14px; font-size:12px; letter-spacing:.15em;">文章将在此处陈列</p>
    </div>
    <svg class="snake" width="220" height="36" viewBox="0 0 320 56" fill="none">
      <path d="M 20 28 C 42 8, 64 48, 86 28 C 108 8, 130 48, 152 28 C 174 8, 196 48, 218 28 C 240 8, 260 42, 274 46" stroke="#e02929" stroke-width="5.5" stroke-linecap="round" opacity="0.85"/>
      <path d="M 20 28 C 42 8, 64 48, 86 28 C 108 8, 130 48, 152 28 C 174 8, 196 48, 218 28 C 240 8, 260 42, 274 46" stroke="#7d0f0f" stroke-width="2.2" stroke-linecap="round" opacity="0.5"/>
      <path d="M 20 28 C 13 23, 7 20, 4 14" stroke="#e02929" stroke-width="4.5" stroke-linecap="round" opacity="0.85"/>
      <path d="M 274 46 L 288 34 L 302 33 L 298 47 L 284 52 Z" fill="#e02929" opacity="0.85"/>
      <circle cx="294" cy="37" r="2.3" fill="#0a0a0a"/>
      <path d="M 302 33 L 308 27 M 302 35 L 308 37" stroke="#e02929" stroke-width="1.7" stroke-linecap="round" opacity="0.85"/>
    </svg>
    <footer>© 2026 MAURA</footer>
  </div>
</body>
</html>
