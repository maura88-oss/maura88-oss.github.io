<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>关于 · MAURA</title>
<style>
  :root { --black:#0a0a0a; --blood:#a01616; --blood-light:#e02929; --ash:#cfc6c6; --ash-dim:#7d7373; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: Georgia, "Times New Roman", "Songti SC", serif;
    background: radial-gradient(ellipse 80% 50% at 50% -10%, #1c0a0a 0%, rgba(10,10,10,0) 70%), var(--black);
    color: var(--ash);
    min-height: 100vh;
    padding: 70px 24px 100px;
  }
  .wrap { max-width: 700px; margin: 0 auto; }
  .top {
    display: flex; align-items: baseline; justify-content: space-between;
    border-bottom: 1px solid rgba(160,22,22,.5);
    padding-bottom: 18px;
    margin-bottom: 48px;
  }
  .top h1 {
    font-size: 30px; font-weight: normal; letter-spacing: .3em; color: #f2ecec;
    text-shadow: 0 0 16px rgba(160,22,22,.5);
  }
  .top h1 span { color: var(--blood-light); }
  .top a { color: var(--ash-dim); text-decoration: none; font-size: 13px; letter-spacing: .2em; transition: color .3s; }
  .top a:hover { color: var(--blood-light); }
  .sigil { text-align: center; font-size: 40px; color: var(--blood); margin-bottom: 36px; }
  .bio { text-align: center; letter-spacing: .12em; line-height: 2.1; color: var(--ash); }
  .bio .name { font-size: 20px; color: #f2ecec; letter-spacing: .35em; text-indent: .35em; margin-bottom: 18px; }
  .divider { display:flex; align-items:center; gap:14px; margin: 44px 0; color: var(--blood); font-size: 12px; }
  .divider::before, .divider::after { content:""; flex:1; height:1px; background: linear-gradient(to right, transparent, var(--blood)); }
  .divider::after { background: linear-gradient(to left, transparent, var(--blood)); }
  footer { text-align: center; margin-top: 70px; font-size: 12px; letter-spacing: .2em; color: #4d4545; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <h1>关<span>于</span></h1>
      <a href="/">← 返回首页</a>
    </div>
    <div class="sigil">✠</div>
    <div class="bio">
      <p class="name">MAURA</p>
      <p>此处是自我介绍。</p>
      <p>想写什么，告诉我，我帮你填上。</p>
    </div>
    <div class="divider">✠</div>
    <footer>© 2026 MAURA</footer>
  </div>
</body>
</html>
