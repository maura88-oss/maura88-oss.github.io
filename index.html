<style>
  :root {
    --black: #0a0a0a;
    --blood: #7c1212;
    --blood-light: #b82424;
    --ash: #cfc6c6;
    --ash-dim: #7d7373;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    position: relative;
    font-family: Georgia, "Times New Roman", "Songti SC", serif;
    background:
      radial-gradient(ellipse 80% 60% at 50% -10%, #160808 0%, rgba(10,10,10,0) 70%),
      radial-gradient(ellipse 50% 40% at 85% 110%, #0d0505 0%, rgba(10,10,10,0) 60%),
      radial-gradient(1px 1px at 18% 22%, rgba(242,236,236,.55) 50%, transparent 51%),
      radial-gradient(1px 1px at 32% 12%, rgba(242,236,236,.35) 50%, transparent 51%),
      radial-gradient(1.4px 1.4px at 66% 18%, rgba(242,236,236,.45) 50%, transparent 51%),
      radial-gradient(1px 1px at 78% 9%, rgba(224,41,41,.5) 50%, transparent 51%),
      radial-gradient(1px 1px at 88% 30%, rgba(242,236,236,.3) 50%, transparent 51%),
      radial-gradient(1.2px 1.2px at 12% 55%, rgba(224,41,41,.35) 50%, transparent 51%),
      radial-gradient(1px 1px at 8% 78%, rgba(242,236,236,.4) 50%, transparent 51%),
      radial-gradient(1.3px 1.3px at 94% 72%, rgba(224,41,41,.4) 50%, transparent 51%),
      var(--black);
    color: var(--ash);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
    overflow-x: hidden;
  }
  .moon {
    position: absolute;
    top: 24px;
    left: 26px;
    filter: drop-shadow(0 0 14px rgba(232,226,226,.35)) drop-shadow(0 0 30px rgba(184,36,36,.25));
  }
  .title {
    display: flex;
    align-items: center;
    font-size: clamp(56px, 12vw, 128px);
    font-weight: normal;
    letter-spacing: .12em;
    color: #f2ecec;
    text-shadow: 0 0 22px rgba(90,14,14,.45), 0 0 60px rgba(90,14,14,.2), 0 0 90px rgba(184,36,36,.15);
    line-height: 1;
  }
  .title .ma { color: #f2ecec; }
  .title .ra { color: var(--blood-light); }
  .u-snake {
    height: 1.08em;
    width: auto;
    margin: 0 .08em;
    filter: drop-shadow(0 0 10px rgba(168,34,34,.35));
  }
  .subtitle {
    margin-top: 28px;
    font-size: 15px;
    letter-spacing: .55em;
    text-indent: .55em;
    color: var(--ash-dim);
  }
  .snake {
    margin: 36px 0 32px;
    filter: drop-shadow(0 0 14px rgba(130,18,18,.4));
  }
  nav {
    display: flex;
    gap: 46px;
  }
  nav a {
    color: var(--ash-dim);
    text-decoration: none;
    font-size: 14px;
    letter-spacing: .35em;
    text-indent: .35em;
    padding: 10px 0;
    border-bottom: 1px solid transparent;
    transition: color .3s, border-color .3s, text-shadow .3s;
  }
  nav a:hover {
    color: var(--blood-light);
    border-bottom-color: var(--blood);
    text-shadow: 0 0 12px rgba(184,36,36,.5);
  }
  .enter {
    margin-top: 56px;
    display: flex;
    align-items: center;
    gap: 22px;
  }
  .enter .rose {
    filter: drop-shadow(0 0 10px rgba(130,18,18,.3));
  }
  .enter a {
    display: inline-block;
    padding: 15px 56px;
    border: 1px solid var(--blood);
    color: var(--blood-light);
    text-decoration: none;
    font-size: 13px;
    letter-spacing: .5em;
    text-indent: .5em;
    transition: all .35s;
  }
  .enter a:hover {
    background: var(--blood);
    color: #fff;
    box-shadow: 0 0 30px rgba(110,16,16,.5);
  }
  footer {
    position: absolute;
    bottom: 26px;
    width: 100%;
    text-align: center;
    font-size: 12px;
    letter-spacing: .2em;
    color: #4d4545;
  }
</style>
</head>
