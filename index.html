<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAURA · 黑红之域</title>
<style>
  :root {
    --black: #0a0a0a;
    --blood: #a01616;
    --blood-light: #e02929;
    --ash: #cfc6c6;
    --ash-dim: #7d7373;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: Georgia, "Times New Roman", "Songti SC", serif;
    background:
      radial-gradient(ellipse 80% 60% at 50% -10%, #1c0a0a 0%, rgba(10,10,10,0) 70%),
      radial-gradient(ellipse 50% 40% at 85% 110%, #140707 0%, rgba(10,10,10,0) 60%),
      var(--black);
    color: var(--ash);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
    overflow-x: hidden;
  }
  .moon {
    margin-bottom: 26px;
    filter: drop-shadow(0 0 8px rgba(224,41,41,.45));
  }
  .title {
    font-size: clamp(56px, 12vw, 128px);
    font-weight: normal;
    letter-spacing: .28em;
    text-indent: .28em;
    color: #f2ecec;
    text-shadow: 0 0 22px rgba(160,22,22,.55), 0 0 60px rgba(160,22,22,.25);
    line-height: 1;
  }
  .title span {
    color: var(--blood-light);
  }
  .subtitle {
    margin-top: 26px;
    font-size: 15px;
    letter-spacing: .55em;
    text-indent: .55em;
    color: var(--ash-dim);
  }
  .snake {
    margin: 38px 0 34px;
    filter: drop-shadow(0 0 6px rgba(160,22,22,.5));
  }
  nav {
    display: flex;
    gap: 46px;
  }
  nav a {
    color: var(--ash-dim);
    text-decoration: none;
    font-size: 14px;
    letter-spacing: .35em;
    text-indent: .35em;
    padding: 10px 0;
    border-bottom: 1px solid transparent;
    transition: color .3s, border-color .3s, text-shadow .3s;
  }
  nav a:hover {
    color: var(--blood-light);
    border-bottom-color: var(--blood);
    text-shadow: 0 0 12px rgba(224,41,41,.6);
  }
  .enter {
    margin-top: 56px;
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .enter .rose {
    opacity: .9;
    filter: drop-shadow(0 0 6px rgba(192,24,24,.4));
  }
  .enter a {
    display: inline-block;
    padding: 14px 52px;
    border: 1px solid var(--blood);
    color: var(--blood-light);
    text-decoration: none;
    font-size: 13px;
    letter-spacing: .5em;
    text-indent: .5em;
    transition: all .35s;
  }
  .enter a:hover {
    background: var(--blood);
    color: #fff;
    box-shadow: 0 0 26px rgba(160,22,22,.55);
  }
  footer {
    position: absolute;
    bottom: 26px;
    width: 100%;
    text-align: center;
    font-size: 12px;
    letter-spacing: .2em;
    color: #4d4545;
  }
</style>
</head>
<body>
  <svg class="moon" width="64" height="64" viewBox="0 0 64 64" fill="none">
    <path d="M 42 6 A 28 28 0 1 0 42 58 A 23 23 0 1 1 42 6 Z" stroke="#e02929" stroke-width="2.2" opacity="0.9"/>
  </svg>
  <h1 class="title">MAU<span>RA</span></h1>
  <p class="subtitle">用 文 字 · 剖 析 世 界</p>
  <svg class="snake" width="300" height="40" viewBox="0 0 300 40" fill="none">
    <path d="M 16 20 C 36 6, 56 34, 76 20 C 96 6, 116 34, 136 20 C 156 6, 176 34, 196 20 C 216 6, 236 34, 252 20 L 266 13" stroke="#a01616" stroke-width="3.4" stroke-linecap="round" opacity="0.95"/>
    <path d="M 268 7 L 288 3 L 285 17 L 268 17 Z" fill="#e02929"/>
    <circle cx="277" cy="10.5" r="1.8" fill="#0a0a0a"/>
    <path d="M 288 7 L 295 3 M 288 12 L 295 14" stroke="#e02929" stroke-width="1.5" stroke-linecap="round"/>
  </svg>
  <nav>
    <a href="/">首页</a>
    <a href="/blog.html">文章</a>
    <a href="/about.html">关于</a>
  </nav>
  <div class="enter">
    <svg class="rose" width="40" height="46" viewBox="0 0 40 46" fill="none">
      <path d="M 20 22 m -5 0 a 5 5 0 1 1 10 0 a 8 8 0 1 1 -14 0 a 11 11 0 1 1 16 2" stroke="#c01818" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M 20 27 C 18 33, 22 37, 20 42" stroke="#8a6a3a" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M 20 32 C 14 30, 11 34, 15 37" stroke="#5a7a3a" stroke-width="1.4" stroke-linecap="round"/>
    </svg>
    <a href="/blog.html">进 入 博 客</a>
    <svg class="rose" width="40" height="46" viewBox="0 0 40 46" fill="none">
      <path d="M 20 22 m -5 0 a 5 5 0 1 1 10 0 a 8 8 0 1 1 -14 0 a 11 11 0 1 1 16 2" stroke="#c01818" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M 20 27 C 18 33, 22 37, 20 42" stroke="#8a6a3a" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M 20 32 C 14 30, 11 34, 15 37" stroke="#5a7a3a" stroke-width="1.4" stroke-linecap="round"/>
    </svg>
  </div>
  <footer>© 2026 MAURA · 黑红即信仰</footer>
</body>
</html>
